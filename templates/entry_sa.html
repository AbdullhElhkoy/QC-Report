{% extends "base.html" %}
{% block title %}SA — إدخال بيانات{% endblock %}
{% block content %}
<h3 class="mb-1">SA</h3>
<p class="text-muted">إدخال بيانات الوردية</p>

<form method="post" class="card">
  <div class="card-body">
    {% csrf_token %}
    {% include "partials/shift_fields.html" %}

    <div class="row g-3">
      <div class="col-6 col-md-3">
        <label class="form-label" for="{{ sa_form.jc.id_for_label }}">JC</label>
        {{ sa_form.jc }}
        <small class="text-danger d-block">{{ sa_form.jc.errors }}</small>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg mt-4">حفظ</button>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mt-4">إلغاء</a>
  </div>
</form>
{% endblock %}
