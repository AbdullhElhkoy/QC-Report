{% extends "base.html" %}
{% block title %}تسجيل الدخول — QC Report{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5 col-lg-4">
    <div class="card mt-5">
      <div class="card-body">
        <h4 class="card-title text-center mb-1">تسجيل الدخول</h4>
        <p class="text-center hud-tag mb-4"><span class="unit-dot"></span>QC-CORE // BUILD 2050</p>
        {% if form.errors %}
          <div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">اسم المستخدم</label>
            <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                   class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">كلمة المرور</label>
            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">دخول</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
