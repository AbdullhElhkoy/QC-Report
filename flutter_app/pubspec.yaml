name: qc_report_app
description: QC Report mobile/web/desktop client (Flutter) for the QC-Report Django backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.2
  go_router: ^14.2.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  url_launcher: ^6.2.0
  universal_html: ^2.2.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
